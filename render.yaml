# Render Blueprint — Video Orchestration Platform
# https://render.com/docs/blueprint-spec
#
# Deploys: vop-api (web), vop-worker (background worker),
#          vop-postgres (managed Postgres), vop-redis (managed Redis)
#
# Before first deploy:
#   1. Connect this repo in the Render dashboard → New → Blueprint
#   2. Set API_KEY_SECRET as a secret env var on both api and worker services
#   3. For production storage set STORAGE_BACKEND=s3 or azure and supply the
#      relevant credentials — the default (local) uses /tmp which is ephemeral.

services:
  # ── Managed Redis ──────────────────────────────────────────────────────────
  - type: redis
    name: vop-redis
    plan: free
    ipAllowList: [] # private — only accessible by services in this Blueprint

  # ── API (web service) ──────────────────────────────────────────────────────
  - type: web
    name: vop-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # Runs inside the container before the main process on every deploy
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vop-postgres
          property: connectionString # app/config.py validator fixes postgres:// → postgresql+asyncpg://
      - key: REDIS_URL
        fromService:
          type: redis
          name: vop-redis
          property: connectionString
      - key: API_KEY_SECRET
        sync: false # set manually in dashboard — never committed to repo
      - key: STORAGE_BACKEND
        value: local # change to s3 or azure for production
      - key: LOCAL_STORAGE_DIR
        value: /tmp/artifacts
      - key: RENDER_WORK_DIR
        value: /tmp/renders
      - key: LOG_LEVEL
        value: INFO
      - key: ENVIRONMENT
        value: production

  # ── Worker (background service) ────────────────────────────────────────────
  - type: worker
    name: vop-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.worker
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vop-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: vop-redis
          property: connectionString
      - key: API_KEY_SECRET
        sync: false
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /tmp/artifacts
      - key: RENDER_WORK_DIR
        value: /tmp/renders
      - key: LOG_LEVEL
        value: INFO
      - key: ENVIRONMENT
        value: production

# ── Managed Postgres ───────────────────────────────────────────────────────
databases:
  - name: vop-postgres
    databaseName: vop_db
    user: vop_user
    plan: free
